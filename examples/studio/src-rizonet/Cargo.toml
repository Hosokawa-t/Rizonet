[package]
name = "rizonet-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rizonet Studio — a GUI packager that turns any web app into a native Rizonet binary."

[lib]
name = "rizonet_studio"
path = "src/lib.rs"

[[bin]]
name = "rizonet-studio"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true

[dependencies]
rizonet-core = { workspace = true, features = ["iconify"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
include_dir.workspace = true
zip.workspace = true
